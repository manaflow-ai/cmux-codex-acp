[package]
name = "cmux-codex-acp"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "GPL-3.0-or-later"
description = "Codex app-server presented as an Agent Client Protocol (ACP) agent: a translator library and a stdio binary"
repository = "https://github.com/manaflow-ai/cmux-codex-acp"
readme = "README.md"
keywords = ["acp", "codex", "agents"]
categories = ["development-tools"]
publish = false

[lib]
name = "cmux_codex_acp"
path = "src/lib.rs"

[[bin]]
name = "cmux-codex-acp"
path = "src/bin/cmux-codex-acp.rs"
required-features = ["bin"]

[features]
default = ["bin"]
# The stdio binary; the library alone needs only serde_json.
bin = ["dep:tokio"]

[dependencies]
serde_json = "1"
tokio = { version = "1.47", optional = true, features = ["rt", "macros", "process", "io-util", "io-std", "sync", "time"] }

[dev-dependencies]
serde_json = "1"
